<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta
      name="description"
      content="Manish Zade — Full Stack MERN Developer. Portfolio of scalable web applications, real-time systems and eCommerce platforms."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Warm up the connections the first paint depends on. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="dns-prefetch" href="https://api.github.com" />

    <!--
      The font URL used to end in `&display=swap"rel="stylesheet` — the stray
      quotes were inside the href, so the request 404'd and every weight fell
      back to a system font. Also trimmed to the weights actually used.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Ubuntu:wght@400;500;700&display=swap"
    />

    <!--
      Font Awesome 5 covers every fas/far/fab icon on the page. The FA 6 kit
      script that used to sit at the bottom was a second, redundant copy of
      the same icon set.
    -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />

    <title>Manish Zade — Full Stack MERN Developer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!--
      Removed from this page, all of it dead or actively harmful:

        jquery / Script.js  - $(document).ready fired before React rendered, so
                              every selector matched zero elements. The one
                              handler that did bind ran $(".navbar") lookups on
                              every scroll event, and its $("html").animate
                              ({scrollTop:0}) fought Lenis for the scroll
                              position. Rebuilt in Navbar.js.
        typed.js            - never initialised for the reason above; the
                              headline sat empty. Replaced by TypingText.js.
        owl.carousel + css  - ~120KB of jQuery plugin to lay out four static
                              cards. Now a CSS grid.
        waypoints           - never referenced by anything.
        fontawesome kit     - duplicate of the Font Awesome CSS above.
        bootstrap-icons css - no `bi-*` icon is used anywhere in the app.
        styles.css          - the file does not exist; it 404'd on every load.
    -->
  </body>
</html>
